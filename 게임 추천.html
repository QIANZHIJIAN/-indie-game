<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Steam Game Recommendations</title>
<style>
    /* 全局深色背景 */
    body { 
        background-color: #121212; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 40px 20px; 
        color: #e0e0e0;
    }
    
    h1 { 
        text-align: center; 
        color: #ffffff; 
        font-size: 32px;
        margin-bottom: 40px;
        letter-spacing: 1px;
    }

    /* 网格布局 */
    .game-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
        gap: 25px; 
        max-width: 1200px; 
        margin: 0 auto;
    }
