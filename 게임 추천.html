<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Steam Game Recommendations</title>
<style>
    /* 全局深色背景 */
    body { 
        background-color: #121212; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 40px 20px; 
        color: #e0e0e0;
    }
    
    h1 { 
        text-align: center; 
        color: #ffffff; 
        font-size: 32px;
        margin-bottom: 40px;
        letter-spacing: 1px;
    }

    /* 网格布局 */
    .game-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
        gap: 25px; 
        max-width: 1200px; 
        margin: 0 auto;
    }
    /* 卡片样式 */
    .game-card{
        background-color: #1e1e1e; 
        border-radius: 12px; 
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: transform 0.2s;
        border: 1px solid #333;
    }
    .game-card:hover{
        transform: translateY(-5px); 
        border-color: #66c0f4;
    }
    /* 顶部图片 - 这里用本地图片 */
    .game-img {
        width: 100%; 
        height: 160px; 
        background-size: cover; 
        background-position: center;
        /* 如果本地图片名字不对，会显示灰色背景 */
        background-color: #333; 
    }

    .game-info { padding: 20px; }

    .title-en { 
        font-size: 20px; 
        font-weight: bold; 
        color: #ffffff; 
        margin-bottom: 2px;
    }
    .title-zh {
        font-size: 14px;
        color: #aaaaaa;
        margin-bottom: 15px;
    }

    .description {
        font-size: 13px;
        color: #888;
        line-height: 1.5;
        margin-bottom: 15px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid #333;
    }

    .players {
        color: #4caf50;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .dot {
        width: 8px;
        height: 8px;
        background-color: #4caf50;
        border-radius: 50%;
        box-shadow: 0 0 5px #4caf50;
    }

    .review { color: #66c0f4; }

    .price-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .price { 
        color: #a4d007; 
        font-size: 18px; 
        font-weight: bold; 
    }
    .buy-btn {
        background-color: #4c6b22;
        color: #d2e885;
        padding: 5px 15px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
    }
    .buy-btn:hover { background-color: #5c8229; }

</style>
</head>
<body>

    <h1>Top Game Recommendations</h1>

    <div class="game-list">

        <!-- 1. 星露谷物语 -->
        <div class="game-card">
            <!-- 这里的 url('1.jpg') 会直接去找你文件夹里叫 1.jpg 的图片 -->
            <div class="game-img" style="background-image: url('1.jpg');"></div>
            <div class="game-info">
                <div class="title-en">Stardew Valley</div>
                <div class="title-zh">星露谷物语</div>
                <div class="description">You've inherited your grandfather's old farm plot in Stardew Valley. Armed with hand-me-down tools, you set out to begin your new life.</div>
                <div class="stats">
                    <div class="players"><span class="dot"></span> 45,231 Playing</div>
                    <div class="review">Overwhelmingly Positive</div>
                </div>
                <div class="price-row">
                    <span class="price">$14.99</span>
                    <span class="buy-btn">Add to Cart</span>
                </div>
            </div>
        </div>

</body>
