<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Steam Game Recommendations</title>
<style>
    /* 全局深色背景 */
    body { 
        background-color: #121212; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 40px 20px; 
        color: #e0e0e0;
    }
    
    h1 { 
        text-align: center; 
        color: #ffffff; 
        font-size: 32px;
        margin-bottom: 40px;
        letter-spacing: 1px;
    }

    /* 网格布局 */
    .game-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
        gap: 25px; 
        max-width: 1200px; 
        margin: 0 auto;
    }
    /* 卡片样式 */
    .game-card{
        background-color: #1e1e1e; 
        border-radius: 12px; 
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: transform 0.2s;
        border: 1px solid #333;
    }
    .game-card:hover{
        transform: translateY(-5px); 
        border-color: #66c0f4;
    }
